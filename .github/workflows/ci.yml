name: Telco Churn CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest ruff black
      - run: ruff check src app scripts tests
      - run: black --check src app scripts tests
      - run: python -m pytest -q
      - run: python scripts/evaluate_drift.py
      - run: python scripts/evaluate_retraining_alert.py

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up --build -d
      - run: python scripts/smoke_test_api.py --url http://127.0.0.1:8000
      - run: python scripts/load_test_api.py --url http://127.0.0.1:8000 --requests 20 --workers 4
      - run: docker compose logs --no-color
      - run: docker compose down -v
